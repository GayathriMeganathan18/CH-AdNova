<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CH-AdNova — Root Cause Investigation Platform</title>
    <script>
      // Applies the saved/system theme before first paint, so there's no
      // flash of the wrong theme while React boots. Mirrors the logic in
      // src/theme/ThemeContext.jsx exactly.
      (function () {
        try {
          var stored = localStorage.getItem("ch-adnova-theme") || "system";
          var dark =
            stored === "dark" ||
            (stored === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body class="bg-bg text-ink">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
